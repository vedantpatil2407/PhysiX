<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
  <!-- PHYSIX Scientific Orbit Logo -->
  <symbol id="icon-physix-logo" viewBox="0 0 40 40">
    <ellipse cx="20" cy="20" rx="16" ry="6" fill="none" stroke="#35D39A" stroke-width="2" transform="rotate(-30 20 20)" stroke-dasharray="2 3"/>
    <ellipse cx="20" cy="20" rx="16" ry="6" fill="none" stroke="#D6B878" stroke-width="1.8" transform="rotate(30 20 20)"/>
    <ellipse cx="20" cy="20" rx="16" ry="6" fill="none" stroke="#29372E" stroke-width="1.5" transform="rotate(90 20 20)"/>
    <circle cx="20" cy="20" r="5" fill="#35D39A" filter="drop-shadow(0 0 6px #35D39A)"/>
    <circle cx="20" cy="20" r="2.5" fill="#090B0A"/>
    <circle cx="34" cy="14" r="2" fill="#D6B878"/>
    <circle cx="6" cy="26" r="1.5" fill="#35D39A"/>
  </symbol>

  <!-- Search Icon -->
  <symbol id="icon-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="11" cy="11" r="8"></circle>
    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
  </symbol>

  <!-- Close / X Icon -->
  <symbol id="icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="18" y1="6" x2="6" y2="18"></line>
    <line x1="6" y1="6" x2="18" y2="18"></line>
  </symbol>

  <!-- Menu / Hamburger -->
  <symbol id="icon-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="3" y1="12" x2="21" y2="12"></line>
    <line x1="3" y1="6" x2="21" y2="6"></line>
    <line x1="3" y1="18" x2="21" y2="18"></line>
  </symbol>

  <!-- Arrow Right -->
  <symbol id="icon-arrow-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="5" y1="12" x2="19" y2="12"></line>
    <polyline points="12 5 19 12 12 19"></polyline>
  </symbol>

  <!-- External Link / Launch -->
  <symbol id="icon-launch" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
    <polyline points="15 3 21 3 21 9"></polyline>
    <line x1="10" y1="14" x2="21" y2="3"></line>
  </symbol>

  <!-- Class 11 Mechanics / Pendulum -->
  <symbol id="icon-class11" viewBox="0 0 64 64" fill="none">
    <circle cx="32" cy="8" r="4" fill="#35D39A"/>
    <line x1="32" y1="8" x2="48" y2="44" stroke="#A2B0A5" stroke-width="2" stroke-dasharray="3 3"/>
    <line x1="32" y1="8" x2="32" y2="52" stroke="#29372E" stroke-width="2"/>
    <circle cx="48" cy="44" r="9" fill="#16211B" stroke="#35D39A" stroke-width="3"/>
    <path d="M20 54 C 28 58, 36 58, 48 54" stroke="#D6B878" stroke-width="1.5" stroke-dasharray="2 2"/>
    <circle cx="32" cy="52" r="3" fill="#29372E"/>
  </symbol>

  <!-- Class 12 Electromagnetism / Atom -->
  <symbol id="icon-class12" viewBox="0 0 64 64" fill="none">
    <circle cx="32" cy="32" r="8" fill="#35D39A" fill-opacity="0.2" stroke="#35D39A" stroke-width="2"/>
    <circle cx="32" cy="32" r="3" fill="#35D39A"/>
    <ellipse cx="32" cy="32" rx="26" ry="10" stroke="#D6B878" stroke-width="1.5" transform="rotate(-30 32 32)"/>
    <ellipse cx="32" cy="32" rx="26" ry="10" stroke="#35D39A" stroke-width="1.5" stroke-dasharray="3 2" transform="rotate(30 32 32)"/>
    <circle cx="52" cy="20" r="2.5" fill="#D6B878"/>
    <circle cx="12" cy="44" r="2.5" fill="#35D39A"/>
  </symbol>

  <!-- Play Icon -->
  <symbol id="icon-play" viewBox="0 0 24 24" fill="currentColor">
    <polygon points="5 3 19 12 5 21 5 3"></polygon>
  </symbol>

  <!-- Pause Icon -->
  <symbol id="icon-pause" viewBox="0 0 24 24" fill="currentColor">
    <rect x="6" y="4" width="4" height="16"></rect>
    <rect x="14" y="4" width="4" height="16"></rect>
  </symbol>

  <!-- Reset / Reload Icon -->
  <symbol id="icon-reset" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="23 4 23 10 17 10"></polyline>
    <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
  </symbol>

  <!-- Target / JEE Practice -->
  <symbol id="icon-target" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="10"></circle>
    <circle cx="12" cy="12" r="6"></circle>
    <circle cx="12" cy="12" r="2"></circle>
  </symbol>

  <!-- Stethoscope / NEET Practice -->
  <symbol id="icon-neet" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4.5 3v5a4 4 0 0 0 8 0V3"></path>
    <path d="M12.5 8a4 4 0 0 0 8 0V3"></path>
    <path d="M8.5 12v3a5 5 0 0 0 10 0v-1"></path>
    <circle cx="18.5" cy="14" r="2"></circle>
  </symbol>

  <!-- Lightning / Quiz -->
  <symbol id="icon-lightning" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
  </symbol>

  <!-- Book / Formula Hub -->
  <symbol id="icon-book" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
  </symbol>
</svg>
